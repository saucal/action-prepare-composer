name: "Prepare Composer"
description: ""
inputs:
  path:
    description: "Where dependencies should be copied to"
    required: true
  from:
    description: "Take installed dependencies from this previous build"
    required: true
  satis_key:
    description: "SatisPress key (packages.saucal.com). When set, configures composer http-basic auth in the target dir so later composer runs (here or in the same job) can reach private packages."
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: SatisPress auth
      uses: saucal/action-composer-auth@v1
      with:
        username: ${{ inputs.satis_key }}
        path: ${{ inputs.path }}

    - name: Path Setup
      shell: bash
      env:
        PATH_DIR: ${{ inputs.path }}
        FROM_DIR: ${{ inputs.from }}
      run: "${{ github.action_path }}/prepare-composer-wp.sh"

    - name: Prepare WP Core update handler
      shell: bash
      env:
        PATH_DIR: ${{ inputs.path }}
        FROM_DIR: ${{ inputs.from }}
      run: "${{ github.action_path }}/prepare-wp-core-update.sh"
